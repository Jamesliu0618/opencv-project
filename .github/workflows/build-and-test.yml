name: Build and Smoke Tests (Windows)

on:
  push:
    branches: [ '001-*', 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
    - name: Install NUnit.Console runner (choco)
      shell: pwsh
      run: |
        choco install nunit3-console -y || Write-Host "choco install failed or not available; continuing"
    - name: Restore, Build & Test (PowerShell)
      shell: pwsh
      run: |
        pwsh -NoProfile -ExecutionPolicy Bypass -File .specify/scripts/powershell/build-and-test.ps1 -MsBuildPath "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\MSBuild\\Current\\Bin\\MSBuild.exe"

    - name: Smoke Test (PowerShell)
      shell: pwsh
      run: |
        pwsh -NoProfile -ExecutionPolicy Bypass -File .specify/scripts/powershell/smoke-test.ps1 -Mode mock

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: artifacts/test-results
